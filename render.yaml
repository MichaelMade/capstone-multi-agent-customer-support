services:
  - type: web
    name: michaelmade-music-support
    runtime: docker
    plan: free
    region: virginia
    autoDeployTrigger: checksPass
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 60
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: REQUIRE_APP_AUTH
        value: "true"
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: GRADIO_ANALYTICS_ENABLED
        value: "False"
