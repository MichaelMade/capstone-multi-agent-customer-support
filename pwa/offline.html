<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1d4ed8" />
    <title>Music Support — Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, #eff6ff, #eef2ff 55%, #faf5ff);
        color: #0f172a;
      }
      main {
        width: min(88vw, 30rem);
        padding: 2.5rem;
        border: 1px solid rgba(99, 102, 241, 0.18);
        border-radius: 1.5rem;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 70px rgba(30, 64, 175, 0.16);
        text-align: center;
      }
      img {
        width: 6rem;
        height: 6rem;
        border-radius: 1.25rem;
      }
      h1 {
        margin: 1.25rem 0 0.75rem;
        font-size: 1.75rem;
      }
      p {
        margin: 0 auto 1.5rem;
        line-height: 1.6;
        color: #475569;
      }
      button {
        border: 0;
        border-radius: 0.8rem;
        padding: 0.85rem 1.25rem;
        background: #1d4ed8;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      small {
        display: block;
        margin-top: 1.25rem;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" alt="Music Support" />
      <h1>You’re offline</h1>
      <p>
        Reconnect to use the music catalog, invoices, and customer-support
        agents. For your privacy, conversations and account information are
        never saved for offline use.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
      <small>When you’re back online, select Try again to reconnect.</small>
    </main>
  </body>
</html>
